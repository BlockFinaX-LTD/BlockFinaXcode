name: Stellar wallet
on:
  push:
    paths: ['blockfinax-stellar-wallet/**', '.github/workflows/stellar-wallet.yml']
  pull_request:
    paths: ['blockfinax-stellar-wallet/**', '.github/workflows/stellar-wallet.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockfinax-stellar-wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockfinax-stellar-wallet/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
