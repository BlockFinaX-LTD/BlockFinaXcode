<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>BlockFinaX — Markets for FX risk</title>
    <meta name="title" content="BlockFinaX — Markets for FX risk" />
    <meta name="description" content="As payments become programmable, risk should too. BlockFinaX provides the hedging infrastructure that makes cross-border payments predictable." />
    <meta name="keywords" content="FX risk, currency hedging, cross-border payments, emerging markets, FX cover, USD/NGN, USD/GHS, USD/EGP, treasury, trade finance, stablecoin settlement, programmable risk" />
    <!-- Search Console verification. One tag per property, and Google reads all
         of them, so a second is added rather than the first replaced: removing
         a token unverifies whatever property it belonged to and loses that
         property's history. Delete the older one only once it is known to be
         unused. -->
    <meta name="google-site-verification" content="41NETpiN7i6a5flm76Ro0EoWbyGV_sXqOb-NliGKHFE" />
    <meta name="google-site-verification" content="wmZCPoIMn16-SGNqdUU3gPndfSsKuJvX4KUhN78Jq-8" />
    <meta name="theme-color" content="#2d6cff" />
    <!-- Icons.
         Google's own guidance is a square icon whose size is a multiple of 48,
         and it looks at /favicon.ico by default. The site had a single 500x500
         png, which is square but not a multiple of 48, and nothing at all at
         /favicon.ico: that path fell through to the React app and returned
         HTML. Hence the generic globe in search results rather than the mark.

         favicon.svg is deliberately not linked. It is a 200x60 banner in a
         different blue, not the hexagon mark, and a non-square icon fails the
         requirement outright. Linked as an icon it would also be preferred by
         clients that like svg, replacing a correct mark with the wrong one. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />

    <!-- Inter (display + body) + Geist Mono (numerics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.blockfinax.com/" />
    <meta property="og:site_name" content="BlockFinaX" />
    <meta property="og:title" content="BlockFinaX — Markets for FX risk" />
    <meta property="og:description" content="As payments become programmable, risk should too. BlockFinaX provides the hedging infrastructure that makes cross-border payments predictable." />
    <meta property="og:image" content="https://www.blockfinax.com/favicon.png" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.blockfinax.com/" />
    <meta property="twitter:site" content="@blockfinax" />
    <meta property="twitter:title" content="BlockFinaX — Markets for FX risk" />
    <meta property="twitter:description" content="As payments become programmable, risk should too. BlockFinaX provides the hedging infrastructure that makes cross-border payments predictable." />
    <meta property="twitter:image" content="https://www.blockfinax.com/favicon.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BlockFinaX",
      "url": "https://www.blockfinax.com",
      "logo": "https://www.blockfinax.com/favicon.png",
      "description": "As payments become programmable, risk should too. BlockFinaX provides the hedging infrastructure that makes cross-border payments predictable.",
      "sameAs": [
        "https://www.linkedin.com/company/blockfinax",
        "https://x.com/blockfinax"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
